          command: |
            tally() { wc -lcw < "$1" 2>/dev/null; }; tally /tmp/.var/WEST || true
      - run:
          name: Get project
          command: git clone --depth 2 -q --single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Fetch sources
          command: zcat cache-collection.tgz | tar xf -
      - run:
          name: Workspace summary
